<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-arch" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <filter id="shadow-arch" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc" rx="12"/>
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OSCA System Architecture</text>

  <!-- Frontend Layer -->
  <rect x="50" y="70" width="1100" height="320" rx="12" fill="url(#grad-blue)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow-arch)"/>
  <text x="100" y="100" font-size="14" font-weight="bold" fill="#1e40af">📱 FRONTEND (React 18 + TypeScript + Vite)</text>

  <!-- Pages -->
  <rect x="80" y="115" width="220" height="120" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="190" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Pages</text>
  <text x="95" y="155" font-size="9" fill="#334155">• LoginPage</text>
  <text x="95" y="170" font-size="9" fill="#334155">• DashboardPage</text>
  <text x="95" y="185" font-size="9" fill="#334155">• SeniorsListPage</text>
  <text x="95" y="200" font-size="9" fill="#334155">• RegistrationPage (11-step)</text>
  <text x="95" y="215" font-size="9" fill="#334155">• ReportsPage, SMSCenter</text>
  <text x="95" y="230" font-size="9" fill="#334155">• MappingPage, ConfigPage</text>

  <!-- Components -->
  <rect x="320" y="115" width="220" height="120" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="430" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Components</text>
  <text x="335" y="155" font-size="9" fill="#334155">• registration/steps (11)</text>
  <text x="335" y="170" font-size="9" fill="#334155">• dashboard (charts)</text>
  <text x="335" y="185" font-size="9" fill="#334155">• id-generation (NFC card)</text>
  <text x="335" y="200" font-size="9" fill="#334155">• mapping (Leaflet)</text>
  <text x="335" y="215" font-size="9" fill="#334155">• sms, reports, rbac</text>
  <text x="335" y="230" font-size="9" fill="#334155">• ui (primitives)</text>

  <!-- Stores -->
  <rect x="560" y="115" width="200" height="120" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="660" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Zustand Stores</text>
  <text x="575" y="155" font-size="9" fill="#334155">• authStore (session, RBAC)</text>
  <text x="575" y="170" font-size="9" fill="#334155">• seniorsStore (CRUD)</text>
  <text x="575" y="185" font-size="9" fill="#334155">• settingsStore (config)</text>
  <text x="575" y="200" font-size="9" fill="#334155">• uiStore (toasts, nav)</text>

