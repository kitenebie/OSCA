  <rect x="780" y="115" width="200" height="120" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="880" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Services</text>
  <text x="795" y="155" font-size="9" fill="#334155">• supabaseService</text>
  <text x="795" y="170" font-size="9" fill="#334155">• sessionService</text>
  <text x="795" y="185" font-size="9" fill="#334155">• storageService</text>
  <text x="795" y="200" font-size="9" fill="#334155">• deviceInfoService</text>

