  <rect x="80" y="250" width="460" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="310" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Utilities</text>
  <text x="95" y="290" font-size="9" fill="#334155">ncscFormFiller • centenarianFormFiller • idGenerator • nfcSimulator • pdfExport • theme</text>

  <rect x="560" y="250" width="420" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="770" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Hooks &amp; Context</text>
  <text x="575" y="290" font-size="9" fill="#334155">useBarangays • useNcscPdfExport • useCentenarianPdfExport • UsbSignaturePadContext</text>

  <!-- Tech badges -->
  <rect x="80" y="320" width="900" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="110" y="340" font-size="9" fill="#1e40af" font-weight="600">Tailwind CSS 4 │ React Hook Form + Zod │ ApexCharts │ Leaflet │ pdf-lib │ html2canvas │ Motion │ Lucide │ Google GenAI</text>

  <!-- Backend Layer -->
  <rect x="50" y="420" width="750" height="200" rx="12" fill="url(#grad-green)" stroke="#16a34a" stroke-width="2" filter="url(#shadow-arch)"/>
  <text x="100" y="450" font-size="14" font-weight="bold" fill="#166534">☁️ BACKEND (Supabase)</text>

  <rect x="80" y="465" width="160" height="80" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="160" y="485" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">PostgreSQL</text>
  <text x="95" y="502" font-size="8" fill="#334155">seniors (100+ cols)</text>
  <text x="95" y="514" font-size="8" fill="#334155">users, user_sessions</text>
  <text x="95" y="526" font-size="8" fill="#334155">audit_logs, sms_logs</text>
  <text x="95" y="538" font-size="8" fill="#334155">role_permissions</text>

  <rect x="260" y="465" width="160" height="80" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="485" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Storage</text>
  <text x="275" y="502" font-size="8" fill="#334155">profile-photos/</text>
  <text x="275" y="514" font-size="8" fill="#334155">system-assets/</text>
  <text x="275" y="526" font-size="8" fill="#334155">RLS bucket policies</text>

  <rect x="440" y="465" width="160" height="80" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="520" y="485" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Realtime</text>
  <text x="455" y="502" font-size="8" fill="#334155">Session termination</text>
  <text x="455" y="514" font-size="8" fill="#334155">Live data sync</text>
  <text x="455" y="526" font-size="8" fill="#334155">Channel subscriptions</text>

  <rect x="620" y="465" width="160" height="80" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="700" y="485" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Security (RLS)</text>
  <text x="635" y="502" font-size="8" fill="#334155">Row-Level Security</text>
  <text x="635" y="514" font-size="8" fill="#334155">Per-role policies</text>
  <text x="635" y="526" font-size="8" fill="#334155">RA 10173 compliance</text>

  <!-- Fingerprint Bridge Layer -->
  <rect x="830" y="420" width="320" height="200" rx="12" fill="url(#grad-amber)" stroke="#d97706" stroke-width="2" filter="url(#shadow-arch)"/>
  <text x="880" y="450" font-size="14" font-weight="bold" fill="#92400e">🖐️ FINGERPRINT BRIDGE (.NET 8)</text>

  <rect x="860" y="465" width="260" height="80" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="990" y="485" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">REST API (Port 8000)</text>
  <text x="875" y="505" font-size="9" fill="#334155">GET  /api/status — Health check</text>
  <text x="875" y="520" font-size="9" fill="#334155">POST /api/capture — Get template</text>
  <text x="875" y="535" font-size="9" fill="#334155">POST /api/verify  — Compare</text>

  <rect x="860" y="555" width="260" height="40" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="990" y="578" text-anchor="middle" font-size="10" fill="#92400e">Windows Biometric Framework (Hello)</text>

  <!-- Connection Arrows -->
  <!-- Pages → Components -->
  <line x1="300" y1="175" x2="318" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-arch)"/>
  <!-- Components → Stores -->
  <line x1="540" y1="175" x2="558" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-arch)"/>
  <!-- Stores → Services -->
  <line x1="760" y1="175" x2="778" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-arch)"/>

  <!-- Services → Supabase -->
  <line x1="880" y1="235" x2="880" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#arrow-arch)" stroke-dasharray="6,3"/>
  <text x="890" y="370" font-size="9" fill="#475569" font-weight="600">CRUD / Auth</text>

  <!-- Frontend → Bridge -->
  <line x1="990" y1="355" x2="990" y2="418" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-arch)" stroke-dasharray="6,3"/>
  <text x="1000" y="395" font-size="9" fill="#92400e" font-weight="600">HTTP (CORS)</text>

  <!-- Network Info -->
  <rect x="50" y="650" width="1100" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="675" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">🌐 Network Configuration</text>
  <text x="200" y="705" text-anchor="middle" font-size="10" fill="#475569">Frontend (Dev): http://192.168.8.34:3000</text>
  <text x="550" y="705" text-anchor="middle" font-size="10" fill="#475569">Fingerprint Bridge: http://192.168.8.34:8000</text>
  <text x="920" y="705" text-anchor="middle" font-size="10" fill="#475569">Production: https://me.oscajuban.online</text>

  <!-- RBAC Legend -->
  <rect x="50" y="750" width="1100" height="130" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="775" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">🔐 Role-Based Access Control</text>
  
  <rect x="100" y="790" width="280" height="70" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="240" y="810" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">Encoder</text>
  <text x="115" y="828" font-size="8" fill="#475569">✓ Register seniors, View list</text>
  <text x="115" y="842" font-size="8" fill="#475569">✓ Generate ID cards, PDF forms</text>
  <text x="115" y="856" font-size="8" fill="#475569">✗ Edit/Delete, Reports, SMS, Config</text>

  <rect x="420" y="790" width="280" height="70" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="560" y="810" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">Supervisor</text>
  <text x="435" y="828" font-size="8" fill="#475569">✓ All Encoder permissions</text>
  <text x="435" y="842" font-size="8" fill="#475569">✓ Edit profiles, Reports, SMS</text>
  <text x="435" y="856" font-size="8" fill="#475569">✗ User Management, Config, Delete</text>

  <rect x="740" y="790" width="280" height="70" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="880" y="810" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">Super Admin</text>
  <text x="755" y="828" font-size="8" fill="#475569">✓ Full system control</text>
  <text x="755" y="842" font-size="8" fill="#475569">✓ User management, Force-logout</text>
  <text x="755" y="856" font-size="8" fill="#475569">✓ Configuration, Signatories</text>

</svg>