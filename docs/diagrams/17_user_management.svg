<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1370" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-17_user_management" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-17_user_management" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-17_user_management" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="1370" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="475.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">17. User Management (Create / Update / Delete)</text>
  <line x1="50" y1="50" x2="900" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Actor: Admin -->
  <circle cx="50.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="85" x2="50.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="40.0" y1="95" x2="60.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="42.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="58.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="50.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">Admin</text>
  <line x1="50.0" y1="140" x2="50.0" y2="1340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: UserMgmtPage -->
  <rect x="197.5" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-17_user_management)"/>
  <text x="262.5" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">UserMgmtPage</text>
  <line x1="262.5" y1="140" x2="262.5" y2="1340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: authStore -->
  <rect x="410.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-17_user_management)"/>
  <text x="475.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">authStore</text>
  <line x1="475.0" y1="140" x2="475.0" y2="1340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: supabaseService -->
  <rect x="622.5" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-17_user_management)"/>
  <text x="687.5" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">supabaseService</text>
  <line x1="687.5" y1="140" x2="687.5" y2="1340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Supabase -->
  <rect x="835.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-17_user_management)"/>
  <text x="900.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Supabase</text>
  <line x1="900.0" y1="140" x2="900.0" y2="1340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="254.5" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="156.25" y="163" text-anchor="middle" font-size="9" fill="#334155">Fill new user form (name, role, pass)</text>
  <line x1="262.5" y1="220" x2="467.0" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="368.75" y="213" text-anchor="middle" font-size="9" fill="#334155">addUser({username, role, password})</text>
  <line x1="475.0" y1="270" x2="679.5" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="581.25" y="263" text-anchor="middle" font-size="9" fill="#334155">usersService.create(userData)</text>
  <line x1="687.5" y1="320" x2="892.0" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="793.75" y="313" text-anchor="middle" font-size="9" fill="#334155">INSERT INTO users</text>
  <line x1="900.0" y1="370" x2="695.5" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="793.75" y="363" text-anchor="middle" font-size="9" fill="#64748b">New user row</text>
  <line x1="687.5" y1="420" x2="483.0" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="581.25" y="413" text-anchor="middle" font-size="9" fill="#64748b">Success</text>
  <line x1="475.0" y1="470" x2="270.5" y2="470" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="368.75" y="463" text-anchor="middle" font-size="9" fill="#64748b">User added → refresh list</text>
  <line x1="262.5" y1="520" x2="58.0" y2="520" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="156.25" y="513" text-anchor="middle" font-size="9" fill="#64748b">Toast: "User created"</text>
  <line x1="50.0" y1="570" x2="254.5" y2="570" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="156.25" y="563" text-anchor="middle" font-size="9" fill="#334155">Edit user role / deactivate</text>
  <line x1="262.5" y1="620" x2="467.0" y2="620" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="368.75" y="613" text-anchor="middle" font-size="9" fill="#334155">updateUser(id, {role})</text>
  <line x1="475.0" y1="670" x2="679.5" y2="670" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="581.25" y="663" text-anchor="middle" font-size="9" fill="#334155">usersService.update(id, changes)</text>
  <line x1="687.5" y1="720" x2="892.0" y2="720" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="793.75" y="713" text-anchor="middle" font-size="9" fill="#334155">UPDATE users SET role = ?</text>
  <line x1="900.0" y1="770" x2="695.5" y2="770" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="793.75" y="763" text-anchor="middle" font-size="9" fill="#64748b">Updated</text>
  <line x1="687.5" y1="820" x2="892.0" y2="820" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="793.75" y="813" text-anchor="middle" font-size="9" fill="#334155">INSERT audit_logs (USER_UPDATED)</text>
  <line x1="687.5" y1="870" x2="483.0" y2="870" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="581.25" y="863" text-anchor="middle" font-size="9" fill="#64748b">Success</text>
  <line x1="475.0" y1="920" x2="270.5" y2="920" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="368.75" y="913" text-anchor="middle" font-size="9" fill="#64748b">Updated</text>
  <line x1="50.0" y1="970" x2="254.5" y2="970" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="156.25" y="963" text-anchor="middle" font-size="9" fill="#334155">Confirm delete user</text>
  <line x1="262.5" y1="1020" x2="467.0" y2="1020" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="368.75" y="1013" text-anchor="middle" font-size="9" fill="#334155">deleteUser(id)</text>
  <line x1="475.0" y1="1070" x2="679.5" y2="1070" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="581.25" y="1063" text-anchor="middle" font-size="9" fill="#334155">usersService.delete(id)</text>
  <line x1="687.5" y1="1120" x2="892.0" y2="1120" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-17_user_management)"/>
  <text x="793.75" y="1113" text-anchor="middle" font-size="9" fill="#334155">DELETE FROM users WHERE id = ?</text>
  <line x1="900.0" y1="1170" x2="695.5" y2="1170" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="793.75" y="1163" text-anchor="middle" font-size="9" fill="#64748b">Deleted</text>
  <line x1="687.5" y1="1220" x2="483.0" y2="1220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="581.25" y="1213" text-anchor="middle" font-size="9" fill="#64748b">Success</text>
  <line x1="475.0" y1="1270" x2="270.5" y2="1270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-17_user_management)"/>
  <text x="368.75" y="1263" text-anchor="middle" font-size="9" fill="#64748b">Removed from list</text>
</svg>