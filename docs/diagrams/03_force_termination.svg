<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-03_force_termination" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-03_force_termination" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-03_force_termination" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="720" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="550.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">3. Session Force-Termination (Admin)</text>
  <line x1="50" y1="50" x2="1050" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Actor: Admin -->
  <circle cx="50.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="85" x2="50.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="40.0" y1="95" x2="60.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="42.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="58.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="50.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">Admin</text>
  <line x1="50.0" y1="140" x2="50.0" y2="690" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: UserMgmt -->
  <rect x="185.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-03_force_termination)"/>
  <text x="250.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">UserMgmt</text>
  <line x1="250.0" y1="140" x2="250.0" y2="690" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Supabase -->
  <rect x="385.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-03_force_termination)"/>
  <text x="450.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Supabase</text>
  <line x1="450.0" y1="140" x2="450.0" y2="690" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Realtime -->
  <rect x="585.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-03_force_termination)"/>
  <text x="650.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Realtime</text>
  <line x1="650.0" y1="140" x2="650.0" y2="690" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Target authStore -->
  <rect x="785.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-03_force_termination)"/>
  <text x="850.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Target authStore</text>
  <line x1="850.0" y1="140" x2="850.0" y2="690" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Actor: Target User -->
  <circle cx="1050.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="1050.0" y1="85" x2="1050.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="1040.0" y1="95" x2="1060.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="1050.0" y1="105" x2="1042.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="1050.0" y1="105" x2="1058.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="1050.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">Target User</text>
  <line x1="1050.0" y1="140" x2="1050.0" y2="690" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="242.0" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="150.0" y="163" text-anchor="middle" font-size="9" fill="#334155">Click "Terminate Session"</text>
  <line x1="250.0" y1="220" x2="442.0" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="350.0" y="213" text-anchor="middle" font-size="9" fill="#334155">UPDATE user_sessions SET is_active=false, terminated_by=admin</text>
  <line x1="450.0" y1="270" x2="258.0" y2="270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-03_force_termination)"/>
  <text x="350.0" y="263" text-anchor="middle" font-size="9" fill="#64748b">Success</text>
  <line x1="450.0" y1="320" x2="642.0" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="550.0" y="313" text-anchor="middle" font-size="9" fill="#334155">Broadcast UPDATE event</text>
  <line x1="650.0" y1="370" x2="842.0" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="750.0" y="363" text-anchor="middle" font-size="9" fill="#334155">Channel: session terminated</text>
  <path d="M 850.0 420 L 880.0 420 L 880.0 440 L 850.0 440" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="885.0" y="433" font-size="9" fill="#334155">Detect termination</text>
  <line x1="850.0" y1="470" x2="1042.0" y2="470" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="950.0" y="463" text-anchor="middle" font-size="9" fill="#334155">Show SessionDismissedModal</text>
  <line x1="1050.0" y1="520" x2="858.0" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="950.0" y="513" text-anchor="middle" font-size="9" fill="#334155">Click "OK"</text>
  <path d="M 850.0 570 L 880.0 570 L 880.0 590 L 850.0 590" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-03_force_termination)"/>
  <text x="885.0" y="583" font-size="9" fill="#334155">clearSessionDismissed() + logout()</text>
  <line x1="850.0" y1="620" x2="1042.0" y2="620" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-03_force_termination)"/>
  <text x="950.0" y="613" text-anchor="middle" font-size="9" fill="#64748b">Redirect to LoginPage</text>
</svg>