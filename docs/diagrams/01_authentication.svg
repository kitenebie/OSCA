<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-01_authentication" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-01_authentication" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-01_authentication" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="1020" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="550.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">1. User Authentication (Login)</text>
  <line x1="50" y1="50" x2="1050" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Actor: User -->
  <circle cx="50.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="85" x2="50.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="40.0" y1="95" x2="60.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="42.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="58.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="50.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">User</text>
  <line x1="50.0" y1="140" x2="50.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: LoginPage -->
  <rect x="185.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-01_authentication)"/>
  <text x="250.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">LoginPage</text>
  <line x1="250.0" y1="140" x2="250.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: authStore -->
  <rect x="385.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-01_authentication)"/>
  <text x="450.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">authStore</text>
  <line x1="450.0" y1="140" x2="450.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: sessionService -->
  <rect x="585.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-01_authentication)"/>
  <text x="650.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">sessionService</text>
  <line x1="650.0" y1="140" x2="650.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: deviceInfo -->
  <rect x="785.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-01_authentication)"/>
  <text x="850.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">deviceInfo</text>
  <line x1="850.0" y1="140" x2="850.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Supabase -->
  <rect x="985.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-01_authentication)"/>
  <text x="1050.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Supabase</text>
  <line x1="1050.0" y1="140" x2="1050.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="242.0" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="150.0" y="163" text-anchor="middle" font-size="9" fill="#334155">Enter username + password</text>
  <line x1="250.0" y1="220" x2="442.0" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="350.0" y="213" text-anchor="middle" font-size="9" fill="#334155">login(username, password, rememberMe)</text>
  <line x1="450.0" y1="270" x2="1042.0" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="750.0" y="263" text-anchor="middle" font-size="9" fill="#334155">SELECT * FROM users WHERE username = ?</text>
  <line x1="1050.0" y1="320" x2="458.0" y2="320" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-01_authentication)"/>
  <text x="750.0" y="313" text-anchor="middle" font-size="9" fill="#64748b">User row (hashed password)</text>
  <path d="M 450.0 370 L 480.0 370 L 480.0 390 L 450.0 390" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="485.0" y="383" font-size="9" fill="#334155">Verify password (bcrypt)</text>
  <line x1="450.0" y1="420" x2="642.0" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="550.0" y="413" text-anchor="middle" font-size="9" fill="#334155">generateToken(64)</text>
  <line x1="650.0" y1="470" x2="458.0" y2="470" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-01_authentication)"/>
  <text x="550.0" y="463" text-anchor="middle" font-size="9" fill="#64748b">sessionToken (128-char hex)</text>
  <line x1="450.0" y1="520" x2="842.0" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="650.0" y="513" text-anchor="middle" font-size="9" fill="#334155">getDeviceInfo()</text>
  <line x1="850.0" y1="570" x2="458.0" y2="570" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-01_authentication)"/>
  <text x="650.0" y="563" text-anchor="middle" font-size="9" fill="#64748b">{deviceName, ip, location}</text>
  <line x1="450.0" y1="620" x2="1042.0" y2="620" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="750.0" y="613" text-anchor="middle" font-size="9" fill="#334155">INSERT INTO user_sessions</text>
  <line x1="1050.0" y1="670" x2="458.0" y2="670" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-01_authentication)"/>
  <text x="750.0" y="663" text-anchor="middle" font-size="9" fill="#64748b">Session created</text>
  <line x1="450.0" y1="720" x2="1042.0" y2="720" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="750.0" y="713" text-anchor="middle" font-size="9" fill="#334155">INSERT INTO audit_logs (USER_LOGIN)</text>
  <path d="M 450.0 770 L 480.0 770 L 480.0 790 L 450.0 790" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="485.0" y="783" font-size="9" fill="#334155">localStorage.set(token, user)</text>
  <path d="M 450.0 820 L 480.0 820 L 480.0 840 L 450.0 840" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-01_authentication)"/>
  <text x="485.0" y="833" font-size="9" fill="#334155">startSessionMonitor()</text>
  <line x1="450.0" y1="870" x2="258.0" y2="870" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-01_authentication)"/>
  <text x="350.0" y="863" text-anchor="middle" font-size="9" fill="#64748b">currentUser set</text>
  <line x1="250.0" y1="920" x2="58.0" y2="920" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-01_authentication)"/>
  <text x="150.0" y="913" text-anchor="middle" font-size="9" fill="#64748b">Navigate to Dashboard</text>
</svg>