<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-15_sms_notification" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-15_sms_notification" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-15_sms_notification" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="920" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="475.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">15. SMS Notification (Bulk Send)</text>
  <line x1="50" y1="50" x2="900" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Actor: User -->
  <circle cx="50.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="85" x2="50.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="40.0" y1="95" x2="60.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="42.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="58.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="50.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">User</text>
  <line x1="50.0" y1="140" x2="50.0" y2="890" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: SMSCenterPage -->
  <rect x="197.5" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-15_sms_notification)"/>
  <text x="262.5" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">SMSCenterPage</text>
  <line x1="262.5" y1="140" x2="262.5" y2="890" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: seniorsStore -->
  <rect x="410.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-15_sms_notification)"/>
  <text x="475.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">seniorsStore</text>
  <line x1="475.0" y1="140" x2="475.0" y2="890" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: supabaseService -->
  <rect x="622.5" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-15_sms_notification)"/>
  <text x="687.5" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">supabaseService</text>
  <line x1="687.5" y1="140" x2="687.5" y2="890" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Supabase -->
  <rect x="835.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-15_sms_notification)"/>
  <text x="900.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Supabase</text>
  <line x1="900.0" y1="140" x2="900.0" y2="890" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="254.5" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="156.25" y="163" text-anchor="middle" font-size="9" fill="#334155">Navigate to SMS Center</text>
  <line x1="50.0" y1="220" x2="254.5" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="156.25" y="213" text-anchor="middle" font-size="9" fill="#334155">Select message template</text>
  <line x1="50.0" y1="270" x2="254.5" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="156.25" y="263" text-anchor="middle" font-size="9" fill="#334155">Select recipients (barangay/all)</text>
  <line x1="262.5" y1="320" x2="467.0" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="368.75" y="313" text-anchor="middle" font-size="9" fill="#334155">Filter seniors with contact_number</text>
  <line x1="475.0" y1="370" x2="270.5" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-15_sms_notification)"/>
  <text x="368.75" y="363" text-anchor="middle" font-size="9" fill="#64748b">recipients[] with phone numbers</text>
  <line x1="262.5" y1="420" x2="58.0" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-15_sms_notification)"/>
  <text x="156.25" y="413" text-anchor="middle" font-size="9" fill="#64748b">Preview: message + recipient count</text>
  <line x1="50.0" y1="470" x2="254.5" y2="470" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="156.25" y="463" text-anchor="middle" font-size="9" fill="#334155">Click "Send All"</text>
  <path d="M 262.5 520 L 292.5 520 L 292.5 540 L 262.5 540" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="297.5" y="533" font-size="9" fill="#334155">Replace {name} per recipient</text>
  <line x1="262.5" y1="570" x2="679.5" y2="570" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="475.0" y="563" text-anchor="middle" font-size="9" fill="#334155">smsService.create({recipient, message})</text>
  <line x1="687.5" y1="620" x2="892.0" y2="620" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="793.75" y="613" text-anchor="middle" font-size="9" fill="#334155">INSERT INTO sms_logs (phone, message, sent_at)</text>
  <line x1="900.0" y1="670" x2="695.5" y2="670" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-15_sms_notification)"/>
  <text x="793.75" y="663" text-anchor="middle" font-size="9" fill="#64748b">Created</text>
  <line x1="687.5" y1="720" x2="270.5" y2="720" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-15_sms_notification)"/>
  <text x="475.0" y="713" text-anchor="middle" font-size="9" fill="#64748b">All messages logged</text>
  <line x1="262.5" y1="770" x2="892.0" y2="770" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-15_sms_notification)"/>
  <text x="581.25" y="763" text-anchor="middle" font-size="9" fill="#334155">INSERT audit_logs (SMS_SENT, count: N)</text>
  <line x1="262.5" y1="820" x2="58.0" y2="820" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-15_sms_notification)"/>
  <text x="156.25" y="813" text-anchor="middle" font-size="9" fill="#64748b">Toast: "Sent N messages successfully"</text>
</svg>