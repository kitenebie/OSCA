<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-02_session_validation" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-02_session_validation" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-02_session_validation" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="710" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="400.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">2. Session Validation &amp; Auto-Refresh</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Participant: App.tsx -->
  <rect x="-15.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-02_session_validation)"/>
  <text x="50.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">App.tsx</text>
  <line x1="50.0" y1="140" x2="50.0" y2="680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: authStore -->
  <rect x="218.33333333333337" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-02_session_validation)"/>
  <text x="283.33333333333337" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">authStore</text>
  <line x1="283.33333333333337" y1="140" x2="283.33333333333337" y2="680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: sessionService -->
  <rect x="451.66666666666674" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-02_session_validation)"/>
  <text x="516.6666666666667" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">sessionService</text>
  <line x1="516.6666666666667" y1="140" x2="516.6666666666667" y2="680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Supabase -->
  <rect x="685.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-02_session_validation)"/>
  <text x="750.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Supabase</text>
  <line x1="750.0" y1="140" x2="750.0" y2="680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="275.33333333333337" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-02_session_validation)"/>
  <text x="166.66666666666669" y="163" text-anchor="middle" font-size="9" fill="#334155">initAuth() [on mount]</text>
  <path d="M 283.33333333333337 220 L 313.33333333333337 220 L 313.33333333333337 240 L 283.33333333333337 240" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-02_session_validation)"/>
  <text x="318.33333333333337" y="233" font-size="9" fill="#334155">Get token from localStorage</text>
  <line x1="283.33333333333337" y1="270" x2="508.66666666666674" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-02_session_validation)"/>
  <text x="400.00000000000006" y="263" text-anchor="middle" font-size="9" fill="#334155">validateSession(token)</text>
  <line x1="516.6666666666667" y1="320" x2="742.0" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-02_session_validation)"/>
  <text x="633.3333333333334" y="313" text-anchor="middle" font-size="9" fill="#334155">SELECT FROM user_sessions WHERE token = ?</text>
  <line x1="750.0" y1="370" x2="524.6666666666667" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-02_session_validation)"/>
  <text x="633.3333333333334" y="363" text-anchor="middle" font-size="9" fill="#64748b">Session row</text>
  <path d="M 516.6666666666667 420 L 546.6666666666667 420 L 546.6666666666667 440 L 516.6666666666667 440" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-02_session_validation)"/>
  <text x="551.6666666666667" y="433" font-size="9" fill="#334155">Check expires_at > now()</text>
  <line x1="516.6666666666667" y1="470" x2="291.33333333333337" y2="470" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-02_session_validation)"/>
  <text x="400.00000000000006" y="463" text-anchor="middle" font-size="9" fill="#64748b">Session valid</text>
  <line x1="283.33333333333337" y1="520" x2="742.0" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-02_session_validation)"/>
  <text x="516.6666666666667" y="513" text-anchor="middle" font-size="9" fill="#334155">UPDATE last_activity = now()</text>
  <rect x="320.0" y="558" width="160" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="400.0" y="573" text-anchor="middle" font-size="9" fill="#92400e">Polling: Check every 30s for expiry</text>
  <line x1="283.33333333333337" y1="605" x2="58.0" y2="605" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-02_session_validation)"/>
  <text x="166.66666666666669" y="598" text-anchor="middle" font-size="9" fill="#64748b">currentUser set → Render Dashboard</text>
</svg>