<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-11_ncsc_pdf" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-11_ncsc_pdf" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-11_ncsc_pdf" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="1020" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="550.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">11. NCSC PDF Form Generation</text>
  <line x1="50" y1="50" x2="1050" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Actor: User -->
  <circle cx="50.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="85" x2="50.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="40.0" y1="95" x2="60.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="42.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="58.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="50.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">User</text>
  <line x1="50.0" y1="140" x2="50.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: SeniorProfile -->
  <rect x="185.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-11_ncsc_pdf)"/>
  <text x="250.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">SeniorProfile</text>
  <line x1="250.0" y1="140" x2="250.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: useNcscPdfExport -->
  <rect x="385.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-11_ncsc_pdf)"/>
  <text x="450.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">useNcscPdfExport</text>
  <line x1="450.0" y1="140" x2="450.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: ncscFormFiller.ts -->
  <rect x="585.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-11_ncsc_pdf)"/>
  <text x="650.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">ncscFormFiller.ts</text>
  <line x1="650.0" y1="140" x2="650.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: pdf-lib -->
  <rect x="785.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-11_ncsc_pdf)"/>
  <text x="850.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">pdf-lib</text>
  <line x1="850.0" y1="140" x2="850.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Preview Modal -->
  <rect x="985.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-11_ncsc_pdf)"/>
  <text x="1050.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Preview Modal</text>
  <line x1="1050.0" y1="140" x2="1050.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="242.0" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="150.0" y="163" text-anchor="middle" font-size="9" fill="#334155">Click "Generate NCSC Form"</text>
  <line x1="250.0" y1="220" x2="442.0" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="350.0" y="213" text-anchor="middle" font-size="9" fill="#334155">generatePdf(seniorData)</text>
  <path d="M 450.0 270 L 480.0 270 L 480.0 290 L 450.0 290" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="485.0" y="283" font-size="9" fill="#334155">fetch('/forms/ncsc_blank.pdf')</text>
  <line x1="450.0" y1="320" x2="642.0" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="550.0" y="313" text-anchor="middle" font-size="9" fill="#334155">fillNcscForm(pdfBytes, seniorData)</text>
  <line x1="650.0" y1="370" x2="842.0" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="750.0" y="363" text-anchor="middle" font-size="9" fill="#334155">PDFDocument.load(template)</text>
  <line x1="850.0" y1="420" x2="658.0" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-11_ncsc_pdf)"/>
  <text x="750.0" y="413" text-anchor="middle" font-size="9" fill="#64748b">pdfDoc</text>
  <line x1="650.0" y1="470" x2="842.0" y2="470" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="750.0" y="463" text-anchor="middle" font-size="9" fill="#334155">page.drawText(field, {x, y}) × 100+ fields</text>
  <line x1="650.0" y1="520" x2="842.0" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="750.0" y="513" text-anchor="middle" font-size="9" fill="#334155">embedPng(photo) + drawImage()</text>
  <line x1="650.0" y1="570" x2="842.0" y2="570" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="750.0" y="563" text-anchor="middle" font-size="9" fill="#334155">pdfDoc.save()</text>
  <line x1="850.0" y1="620" x2="658.0" y2="620" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-11_ncsc_pdf)"/>
  <text x="750.0" y="613" text-anchor="middle" font-size="9" fill="#64748b">Uint8Array (filled PDF)</text>
  <line x1="650.0" y1="670" x2="458.0" y2="670" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-11_ncsc_pdf)"/>
  <text x="550.0" y="663" text-anchor="middle" font-size="9" fill="#64748b">PDF bytes</text>
  <path d="M 450.0 720 L 480.0 720 L 480.0 740 L 450.0 740" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="485.0" y="733" font-size="9" fill="#334155">Create Blob URL</text>
  <line x1="450.0" y1="770" x2="1042.0" y2="770" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="750.0" y="763" text-anchor="middle" font-size="9" fill="#334155">Open preview (blobUrl)</text>
  <line x1="1050.0" y1="820" x2="58.0" y2="820" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-11_ncsc_pdf)"/>
  <text x="550.0" y="813" text-anchor="middle" font-size="9" fill="#64748b">PDF preview displayed</text>
  <line x1="50.0" y1="870" x2="1042.0" y2="870" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-11_ncsc_pdf)"/>
  <text x="550.0" y="863" text-anchor="middle" font-size="9" fill="#334155">Click "Download"</text>
  <line x1="1050.0" y1="920" x2="58.0" y2="920" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-11_ncsc_pdf)"/>
  <text x="550.0" y="913" text-anchor="middle" font-size="9" fill="#64748b">Save NCSC_Form_[name].pdf</text>
</svg>