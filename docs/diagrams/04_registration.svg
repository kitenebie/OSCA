  <text x="564.2857142857142" y="463" text-anchor="middle" font-size="9" fill="#334155">POST /api/capture (fingerprint)</text>
  <line x1="735.7142857142857" y1="520" x2="400.85714285714283" y2="520" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-04_registration)"/>
  <text x="564.2857142857142" y="513" text-anchor="middle" font-size="9" fill="#64748b">{template: "Base64..."}</text>
  <line x1="50.0" y1="570" x2="384.85714285714283" y2="570" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="221.42857142857142" y="563" text-anchor="middle" font-size="9" fill="#334155">Step 9: Fill assisting person details</text>
  <line x1="50.0" y1="620" x2="384.85714285714283" y2="620" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="221.42857142857142" y="613" text-anchor="middle" font-size="9" fill="#334155">Step 10: Draw signature (canvas → Base64)</text>
  <line x1="50.0" y1="670" x2="384.85714285714283" y2="670" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="221.42857142857142" y="663" text-anchor="middle" font-size="9" fill="#334155">Step 11: Review → Click "Submit"</text>
  <line x1="392.85714285714283" y1="720" x2="899.1428571428571" y2="720" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="650.0" y="713" text-anchor="middle" font-size="9" fill="#334155">Collect all step data</text>
  <line x1="907.1428571428571" y1="770" x2="1070.5714285714284" y2="770" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="992.8571428571428" y="763" text-anchor="middle" font-size="9" fill="#334155">seniorsService.create(formData)</text>
  <path d="M 1078.5714285714284 820 L 1108.5714285714284 820 L 1108.5714285714284 840 L 1078.5714285714284 840" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="1113.5714285714284" y="833" font-size="9" fill="#334155">Map camelCase → snake_case</text>
