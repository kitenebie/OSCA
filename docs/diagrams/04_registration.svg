  <line x1="1250.0" y1="920" x2="1086.5714285714284" y2="920" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-04_registration)"/>
  <text x="1164.2857142857142" y="913" text-anchor="middle" font-size="9" fill="#64748b">photo_url</text>
  <line x1="1078.5714285714284" y1="970" x2="1242.0" y2="970" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="1164.2857142857142" y="963" text-anchor="middle" font-size="9" fill="#334155">INSERT INTO seniors (100+ cols)</text>
  <line x1="1250.0" y1="1020" x2="1086.5714285714284" y2="1020" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-04_registration)"/>
  <text x="1164.2857142857142" y="1013" text-anchor="middle" font-size="9" fill="#64748b">New record (auto OSCA#)</text>
  <line x1="1078.5714285714284" y1="1070" x2="1242.0" y2="1070" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-04_registration)"/>
  <text x="1164.2857142857142" y="1063" text-anchor="middle" font-size="9" fill="#334155">INSERT INTO audit_logs</text>
  <line x1="1078.5714285714284" y1="1120" x2="915.1428571428571" y2="1120" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-04_registration)"/>
  <text x="992.8571428571428" y="1113" text-anchor="middle" font-size="9" fill="#64748b">Success</text>
  <line x1="907.1428571428571" y1="1170" x2="229.42857142857142" y2="1170" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-04_registration)"/>
  <text x="564.2857142857142" y="1163" text-anchor="middle" font-size="9" fill="#64748b">Update local cache</text>
  <line x1="221.42857142857142" y1="1220" x2="58.0" y2="1220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-04_registration)"/>
  <text x="135.71428571428572" y="1213" text-anchor="middle" font-size="9" fill="#64748b">Toast: "Senior registered!"</text>
