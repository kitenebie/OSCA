<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 870" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead-14_gis_mapping" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-dashed-14_gis_mapping" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow-14_gis_mapping" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="870" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="425.0" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">14. GIS Mapping &amp; Geotagging</text>
  <line x1="50" y1="50" x2="800" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Actor: User -->
  <circle cx="50.0" cy="75" r="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="85" x2="50.0" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="40.0" y1="95" x2="60.0" y2="95" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="42.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="50.0" y1="105" x2="58.0" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="50.0" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">User</text>
  <line x1="50.0" y1="140" x2="50.0" y2="840" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: MappingPage -->
  <rect x="235.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-14_gis_mapping)"/>
  <text x="300.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">MappingPage</text>
  <line x1="300.0" y1="140" x2="300.0" y2="840" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: seniorsStore -->
  <rect x="485.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-14_gis_mapping)"/>
  <text x="550.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">seniorsStore</text>
  <line x1="550.0" y1="140" x2="550.0" y2="840" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Participant: Leaflet + Cluster -->
  <rect x="735.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-14_gis_mapping)"/>
  <text x="800.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Leaflet + Cluster</text>
  <line x1="800.0" y1="140" x2="800.0" y2="840" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50.0" y1="170" x2="292.0" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="175.0" y="163" text-anchor="middle" font-size="9" fill="#334155">Navigate to Mapping</text>
  <line x1="300.0" y1="220" x2="542.0" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="425.0" y="213" text-anchor="middle" font-size="9" fill="#334155">Get seniors with coordinates</text>
  <line x1="550.0" y1="270" x2="308.0" y2="270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-14_gis_mapping)"/>
  <text x="425.0" y="263" text-anchor="middle" font-size="9" fill="#64748b">seniors[] with {lat, lng}</text>
  <line x1="300.0" y1="320" x2="792.0" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="550.0" y="313" text-anchor="middle" font-size="9" fill="#334155">Init map (center: Juban, Sorsogon)</text>
  <line x1="300.0" y1="370" x2="792.0" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="550.0" y="363" text-anchor="middle" font-size="9" fill="#334155">Create MarkerClusterGroup</text>
  <line x1="300.0" y1="420" x2="792.0" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="550.0" y="413" text-anchor="middle" font-size="9" fill="#334155">Add markers for each senior with coords</text>
  <path d="M 800.0 470 L 830.0 470 L 830.0 490 L 800.0 490" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="835.0" y="483" font-size="9" fill="#334155">Calculate clusters for zoom level</text>
  <line x1="800.0" y1="520" x2="58.0" y2="520" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-14_gis_mapping)"/>
  <text x="425.0" y="513" text-anchor="middle" font-size="9" fill="#64748b">Render interactive map</text>
  <line x1="50.0" y1="570" x2="792.0" y2="570" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="425.0" y="563" text-anchor="middle" font-size="9" fill="#334155">Click a marker</text>
  <line x1="800.0" y1="620" x2="58.0" y2="620" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-14_gis_mapping)"/>
  <text x="425.0" y="613" text-anchor="middle" font-size="9" fill="#64748b">Popup: Name, Barangay, OSCA#, Age</text>
  <line x1="50.0" y1="670" x2="292.0" y2="670" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="175.0" y="663" text-anchor="middle" font-size="9" fill="#334155">Filter by barangay</text>
  <line x1="300.0" y1="720" x2="792.0" y2="720" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-14_gis_mapping)"/>
  <text x="550.0" y="713" text-anchor="middle" font-size="9" fill="#334155">Clear + re-add filtered markers</text>
  <line x1="800.0" y1="770" x2="58.0" y2="770" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-14_gis_mapping)"/>
  <text x="425.0" y="763" text-anchor="middle" font-size="9" fill="#64748b">Updated map view</text>
</svg>