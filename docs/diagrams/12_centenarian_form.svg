  <text x="650.0" y="213" text-anchor="middle" font-size="9" fill="#334155">Fetch centenarian seniors (age ≥ 100)</text>
  <line x1="1050.0" y1="270" x2="258.0" y2="270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-12_centenarian_form)"/>
  <text x="650.0" y="263" text-anchor="middle" font-size="9" fill="#64748b">Centenarian records[]</text>
