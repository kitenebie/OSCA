  <rect x="585.0" y="70" width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-12_centenarian_form)"/>
  <text x="650.0" y="91" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">centenarianFiller</text>
  <line x1="650.0" y1="140" x2="650.0" y2="990" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
