  <text x="150.0" y="363" text-anchor="middle" font-size="9" fill="#334155">Select senior → "Generate Claim Form"</text>
  <line x1="250.0" y1="420" x2="1042.0" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-12_centenarian_form)"/>
  <text x="650.0" y="413" text-anchor="middle" font-size="9" fill="#334155">Fetch document_signatories</text>
  <line x1="1050.0" y1="470" x2="258.0" y2="470" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-12_centenarian_form)"/>
  <text x="650.0" y="463" text-anchor="middle" font-size="9" fill="#64748b">Signatories with signature_data</text>
  <line x1="250.0" y1="520" x2="442.0" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-12_centenarian_form)"/>
  <text x="350.0" y="513" text-anchor="middle" font-size="9" fill="#334155">generateCentenarianPdf(senior, signatories)</text>
  <line x1="450.0" y1="570" x2="642.0" y2="570" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-12_centenarian_form)"/>
  <text x="550.0" y="563" text-anchor="middle" font-size="9" fill="#334155">fillCentenarianForm(template, senior, sigs)</text>
  <line x1="650.0" y1="620" x2="842.0" y2="620" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-12_centenarian_form)"/>
  <text x="750.0" y="613" text-anchor="middle" font-size="9" fill="#334155">Load template + drawText all fields</text>
  <line x1="650.0" y1="670" x2="842.0" y2="670" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-12_centenarian_form)"/>
  <text x="750.0" y="663" text-anchor="middle" font-size="9" fill="#334155">Embed signatory signatures (Base64 → image)</text>
  <line x1="650.0" y1="720" x2="842.0" y2="720" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead-12_centenarian_form)"/>
  <text x="750.0" y="713" text-anchor="middle" font-size="9" fill="#334155">pdfDoc.save()</text>
  <line x1="850.0" y1="770" x2="658.0" y2="770" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-12_centenarian_form)"/>
  <text x="750.0" y="763" text-anchor="middle" font-size="9" fill="#64748b">Uint8Array</text>
  <line x1="650.0" y1="820" x2="458.0" y2="820" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-12_centenarian_form)"/>
  <text x="550.0" y="813" text-anchor="middle" font-size="9" fill="#64748b">PDF bytes</text>
  <line x1="450.0" y1="870" x2="258.0" y2="870" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-12_centenarian_form)"/>
  <text x="350.0" y="863" text-anchor="middle" font-size="9" fill="#64748b">Blob URL</text>
  <line x1="250.0" y1="920" x2="58.0" y2="920" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-12_centenarian_form)"/>
  <text x="150.0" y="913" text-anchor="middle" font-size="9" fill="#64748b">Preview + Download</text>
